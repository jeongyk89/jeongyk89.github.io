<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>API 키 복사</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#172333;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6}main{max-width:720px;margin:9vh auto;padding:24px}header{margin-bottom:30px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;color:#586b83}h1{font-size:32px;margin:8px 0}p{margin:8px 0;color:#576477}.card{background:#fff;border:1px solid #dbe2eb;border-radius:18px;padding:24px;margin:16px 0;box-shadow:0 4px 18px #17233305}h2{font-size:20px;margin:0 0 16px}.field{display:flex;gap:8px}input{width:100%;min-width:0;font:14px ui-monospace,SFMono-Regular,Consolas,monospace;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;color:#25344a;padding:13px}button{border:0;border-radius:9px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;background:#edf1f6;color:#26364c}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible{outline:3px solid #76a9ff;outline-offset:3px}.copy{background:#175cd3;color:#fff;width:100%;margin-top:12px}.status{min-height:26px;margin:14px 0;color:#175cd3;font-size:14px}.note{font-size:13px;color:#6b5960;border-top:1px solid #dbe2eb;padding-top:18px;margin-top:22px}@media(max-width:480px){main{margin:3vh auto;padding:18px}.card{padding:18px}h1{font-size:28px}}
</style>
</head>
<body>
<main>
<header><div class="eyebrow">PERSONAL · API KEYS</div><h1>API 키 복사</h1><p>사용할 서비스의 복사 버튼을 누른 뒤 붙여넣으세요.</p></header>
<section class="card" aria-labelledby="openai-title">
<h2 id="openai-title">OpenAI</h2>
<div class="field"><input id="openai-key" type="password" readonly autocomplete="off" spellcheck="false" aria-label="OpenAI API 키" value="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"><button type="button" data-reveal="openai-key" aria-label="OpenAI 키 보기" aria-pressed="false">보기</button></div>
<button type="button" class="copy" data-copy="openai-key" data-name="OpenAI">OpenAI 키 복사</button>
</section>
<section class="card" aria-labelledby="gemini-title">
<h2 id="gemini-title">Gemini</h2>
<div class="field"><input id="gemini-key" type="password" readonly autocomplete="off" spellcheck="false" aria-label="Gemini API 키" value="AQ.Ab8RN6ITz2Ke6nBM6rg9VjzfzcTIcrMDWSrAxxSabTwCD5OOHg"><button type="button" data-reveal="gemini-key" aria-label="Gemini 키 보기" aria-pressed="false">보기</button></div>
<button type="button" class="copy" data-copy="gemini-key" data-name="Gemini">Gemini 키 복사</button>
</section>
<div id="status" class="status" role="status" aria-live="polite"></div>
<p class="note">이 파일에는 두 키가 원문으로 들어 있습니다. 개인용으로 보관하고 공개 사이트나 GitHub에 올리지 마세요. 이 페이지는 키를 외부로 전송하거나 API를 호출하지 않습니다.</p>
</main>
<script>
'use strict';
const statusEl = document.getElementById('status');
function setRevealed(input, visible) {
  input.type = visible ? 'text' : 'password';
  const button = document.querySelector('[data-reveal="' + input.id + '"]');
  button.textContent = visible ? '숨기기' : '보기';
  button.setAttribute('aria-pressed', String(visible));
  button.setAttribute('aria-label', (input.id === 'openai-key' ? 'OpenAI' : 'Gemini') + ' 키 ' + (visible ? '숨기기' : '보기'));
}
document.querySelectorAll('[data-reveal]').forEach(button => {
  button.addEventListener('click', () => {
    const input = document.getElementById(button.dataset.reveal);
    setRevealed(input, input.type === 'password');
  });
});
async function copyValue(value) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
      return true;
    }
  } catch (_) {}
  const field = document.createElement('textarea');
  field.value = value;
  field.readOnly = true;
  field.style.cssText = 'position:fixed;left:0;top:0;width:1px;height:1px;opacity:0';
  const previousFocus = document.activeElement;
  document.body.appendChild(field);
  let copied = false;
  try {
    field.focus();
    field.select();
    field.setSelectionRange(0, value.length);
    copied = document.execCommand('copy');
  } catch (_) {} finally {
    field.remove();
    if (previousFocus) previousFocus.focus();
  }
  return copied;
}
document.querySelectorAll('[data-copy]').forEach(button => {
  button.addEventListener('click', async () => {
    const input = document.getElementById(button.dataset.copy);
    statusEl.textContent = '';
    button.disabled = true;
    const copied = await copyValue(input.value);
    button.disabled = false;
    if (copied) {
      statusEl.textContent = button.dataset.name + ' 키를 복사했습니다.';
    } else {
      setRevealed(input, true);
      input.focus();
      input.select();
      input.setSelectionRange(0, input.value.length);
      statusEl.textContent = '자동 복사가 제한되어 키를 선택했습니다. Ctrl+C / ⌘C 또는 길게 눌러 복사하세요.';
    }
  });
});
</script>
</body>
</html>
