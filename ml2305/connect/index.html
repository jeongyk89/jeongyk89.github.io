<style>
:root{--ink:#16212e;--muted:#4a5563;--bg:#f4f3ee;--line:#d6dce3;--kth:#004791;--navy:#000061;--soft:#e6eef8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
header{background:var(--navy);color:#fff;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:19px;margin:0}.sub{font-size:13px;color:#c9d7ea}
.who{margin-left:auto;font-size:13px;color:#c9d7ea;text-align:right}
.dot{width:10px;height:10px;border-radius:99px;background:#9aa6b2;display:inline-block;margin-right:6px}.dot.on{background:#2fbf71}.dot.err{background:#e5484d}
main{max-width:1180px;margin:0 auto;padding:14px 14px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--kth)}
.muted{color:var(--muted)}.small{font-size:13px}
h2{font-size:21px;margin:4px 0 8px}
.btn{background:var(--kth);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--kth);border:1.5px solid var(--kth)}
.btn.red{background:#c4422b}.btn.go{background:#1f9d5a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.huge{width:100%;font-size:22px;padding:20px;border-radius:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.pick button{border:2px solid var(--line);background:#fbfaf7;border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.pick button b{display:block}.pick button span{font-size:12px;color:var(--muted)}
.pick button.on{border-color:var(--kth);background:var(--soft)}
.value{font-size:48px;font-weight:900;line-height:1.05}
.value small{font-size:20px;font-weight:700;color:var(--muted)}
pre{background:#0f1b2d;color:#d8e6ff;border-radius:10px;padding:10px;font-size:13px;overflow:auto;margin:6px 0;white-space:pre-wrap;word-break:break-all}
.fb{border-radius:12px;padding:12px;font-weight:800;margin-top:10px;font-size:17px}
.fb.ok{background:#e5f3ea;color:#14633a}.fb.bad{background:#fae6e4;color:#b3321f}.fb.wait{background:#fbf2dc;color:#8a5a00}
.rounds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rounds button{border:2px solid var(--line);background:#fbfaf7;border-radius:12px;padding:10px;text-align:left;cursor:pointer}
.rounds button b{display:block;font-size:16px}.rounds button span{font-size:12px;color:var(--muted)}
.rounds button.on{border-color:var(--kth);background:var(--soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{border-radius:14px;padding:12px;border:2px solid var(--line);background:#fff}
.tile.alarm{border-color:#c4422b;background:#fae6e4}
.tile.unk{background:#f2f3f5}
.tile .st{font-weight:900;font-size:15px}
.tile .v{font-size:28px;font-weight:900}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:11px;font-weight:800;background:#e3e7ec;color:#4a5563}
.tag.you{background:#fbf2dc;color:#8a5a00}.tag.sup{background:#e6eef8;color:#004791}.tag.std{background:#e5f3ea;color:#14633a}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.big{font-size:26px;font-weight:900}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.hide{display:none!important}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.rounds{grid-template-columns:1fr}}
</style>

<body>
<header>
  <div class="top">
    <div><h1 id="ttl">Connect</h1><div class="sub" id="sub">ML2305 Lab 3 · can the plant view catch the problem?</div></div>
    <div class="who"><span class="dot" id="dot"></span><span id="whoText">not joined</span></div>
  </div>
</header>
<main id="main"></main>
<script>
/* ===== minimal MQTT 3.1.1 over WebSocket ===== */
class MiniMQTT {
  constructor(url, o = {}) { this.url = url; this.o = o; this.buf = new Uint8Array(0); this.subs = []; this.pid = 1; this.enc = new TextEncoder(); this.dec = new TextDecoder(); }
  _s(str) { const b = this.enc.encode(str); return [b.length >> 8, b.length & 255, ...b]; }
  _len(n) { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; }
  _send(h, body) { if (!this.ws || this.ws.readyState !== 1) return false; this.ws.send(new Uint8Array([h, ...this._len(body.length), ...body])); return true; }
  connect() { return new Promise((res, rej) => { let done = false; const fail = e => { if (!done) { done = true; rej(e); } };
    try { this.ws = new WebSocket(this.url, ['mqtt']); } catch (e) { return fail(e); }
    this.ws.binaryType = 'arraybuffer'; const to = setTimeout(() => { fail(new Error('timeout')); try { this.ws.close(); } catch (e) {} }, 8000);
    this.ws.onopen = () => { let f = 0x02; const pl = this._s('ml2305-' + Math.random().toString(36).slice(2, 10)); if (this.o.username) { f |= 0x80; pl.push(...this._s(this.o.username)); } if (this.o.password) { f |= 0x40; pl.push(...this._s(this.o.password)); } this._send(0x10, [...this._s('MQTT'), 4, f, 0, 30, ...pl]); this._ping = setInterval(() => this._send(0xC0, []), 20000); };
    this.ws.onmessage = ev => { const d = new Uint8Array(ev.data), nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) { if (this.buf.length < 2) break; let m = 1, len = 0, i = 1, b; do { if (i >= this.buf.length) return; b = this.buf[i++]; len += (b & 127) * m; m *= 128; } while (b & 128); if (this.buf.length < i + len) break;
        const h = this.buf[0], body = this.buf.slice(i, i + len); this.buf = this.buf.slice(i + len); const t = h >> 4;
        if (t === 2) { clearTimeout(to); if (body[1] === 0) { done = true; this.subs.forEach(s => this._sub(s)); res(); this.onstatus && this.onstatus('on'); } else fail(new Error('refused')); }
        else if (t === 3) { const q = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = this.dec.decode(body.slice(2, 2 + tl)); let p = 2 + tl; if (q > 0) { const id = [body[p], body[p + 1]]; p += 2; if (q === 1) this._send(0x40, id); } this.onmessage && this.onmessage(topic, this.dec.decode(body.slice(p))); } } };
    this.ws.onerror = () => { fail(new Error('error')); this.onstatus && this.onstatus('err'); };
    this.ws.onclose = () => { clearInterval(this._ping); this.onstatus && this.onstatus(done ? 'closed' : 'err'); fail(new Error('closed')); }; }); }
  _sub(f) { const id = this.pid++ & 0xffff; this._send(0x82, [id >> 8, id & 255, ...this._s(f), 0]); }
  subscribe(f) { if (!this.subs.includes(f)) this.subs.push(f); this._sub(f); }
  publish(t, p, retain) { return this._send(retain ? 0x31 : 0x30, [...this._s(t), ...this.enc.encode(p)]); }
  close() { try { this._send(0xE0, []); this.ws.close(); } catch (e) {} }
}
const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const fmt = (v, d = 1) => v == null || isNaN(v) ? '–' : (+v).toFixed(d);

/* ===== the shared standard: one name and one unit per quantity ===== */
const STD = {Temperature:'degC', Battery:'percent', Speed:'m/s', Weight:'kg', Power:'W'};
const UNITS = {Temperature:['degC', 'degF', 'K'], Battery:['percent', 'fraction'], Speed:['m/s', 'mm/s'], Weight:['kg', 'g'], Power:['W', 'kW']};
const UNIT_LABEL = {degC:'°C', degF:'°F', K:'K', percent:'%', fraction:'0 to 1', 'm/s':'m/s', 'mm/s':'mm/s', kg:'kg', g:'g', W:'W', kW:'kW'};
function toStd(v, unit) { v = parseFloat(v); if (isNaN(v)) return null; switch (unit) { case 'degF': return (v - 32) * 5 / 9; case 'K': return v - 273.15; case 'fraction': return v * 100; case 'mm/s': return v / 1000; case 'g': return v / 1000; case 'kW': return v * 1000; default: return v; } }
/* every device has one quantity, one alarm rule in standard units, and the habits of its supplier */
const DEVICES = [
  {id:'freezer', name:'Freezer', sup:'Nordtemp AB', q:'Temperature', normal:-19, problem:-4, rule:v => v > -15, ruleTxt:'warmer than −15 °C', habit:'American firmware. Fahrenheit, local time.', own:(v, t) => ({dev:'NT-204', tempF:+(v * 9 / 5 + 32).toFixed(1), time:local(t)}), field:'tempF', unit:'degF', period:1},
  {id:'amr', name:'Mobile robot', sup:'RoboMove GmbH', q:'Battery', normal:78, problem:9, rule:v => v < 15, ruleTxt:'battery under 15 %', habit:'Battery as a fraction, Unix seconds.', own:(v, t) => ({robot:'MiR-2', bat:+(v / 100).toFixed(3), mode:'moving', ts:Math.floor(t / 1000)}), field:'bat', unit:'fraction', period:1},
  {id:'conveyor', name:'Conveyor', sup:'BeltCo', q:'Speed', normal:.5, problem:0, rule:v => v < .1, ruleTxt:'slower than 0.1 m/s', habit:'Everything is a string, millimetres per second.', own:(v, t) => ({id:'CV-1', running:v > .05 ? 'true' : 'false', speed_mm_s:String(Math.round(v * 1000)), t:String(t)}), field:'speed_mm_s', unit:'mm/s', period:1},
  {id:'shelf', name:'Smart shelf', sup:'Shelfie Sverige', q:'Weight', normal:4.6, problem:.3, rule:v => v < 1, ruleTxt:'lighter than 1 kg, refill', habit:'Swedish field names, grams, no time.', own:v => ({hylla:'S3', vikt:Math.round(v * 1000), antal:Math.round(v / .2)}), field:'vikt', unit:'g', period:1},
  {id:'robotcell', name:'Robot cell', sup:'ArmTech', q:'Power', normal:900, problem:3300, rule:v => v > 2500, ruleTxt:'more than 2500 W', habit:'Nested JSON, kilowatts, ISO time.', own:(v, t) => ({asset:{id:'UR5e-1'}, power:{value:+(v / 1000).toFixed(2), unit:'kW'}, timestamp:new Date(t).toISOString()}), field:'power.value', unit:'kW', period:1},
  {id:'meter', name:'Energy meter', sup:'VoltView', q:'Power', normal:3100, problem:6400, rule:v => v > 5000, ruleTxt:'more than 5000 W', habit:'Kilowatts, sends only every 4 s.', own:(v, t) => ({meter:'EM-9', P_kW:+(v / 1000).toFixed(2), date:local(t)}), field:'P_kW', unit:'kW', period:4}
];
const dev = id => DEVICES.find(d => d.id === id);
function local(t) { const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function fieldsOf(o, pre = '') { const out = []; for (const [k, v] of Object.entries(o || {})) { const p = pre ? pre + '.' + k : k; if (v && typeof v === 'object') out.push(...fieldsOf(v, p)); else out.push(p); } return out; }
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? undefined : a[k], o);
function stdMsg(d, v, t) { return {assetId:'urn:kth:lab:' + d.id, quantity:d.q, value:+v.toFixed(3), unit:STD[d.q], time:new Date(t).toISOString()}; }
const ROUNDS = [null, ['Own format', 'Every supplier sends what it always sends. The integrator translates.'], ['Describe', 'Suppliers keep their format and say which field holds the value and in which unit.'], ['Standard', 'Everyone sends the same names and units.']];

/* ===== connection ===== */
const BROKERS = {emqx:{url:'wss://broker.emqx.io:8084/mqtt'}, hivemq:{url:'wss://broker.hivemq.com:8884/mqtt'}, mosq:{url:'wss://test.mosquitto.org:8081/'}, shiftr:{url:'wss://public.cloud.shiftr.io', username:'public', password:'public'}};
let me = lsGet('cx_me', null), client = null, round = 1;
const T = s => `ml2305/cx-${me.team}/${s}`;
function pub(s, o, retain) { if (client) client.publish(T(s), o == null ? '' : JSON.stringify(o), !!retain); }
async function connect() {
  if (client) client.close(); client = null; $('#dot').className = 'dot';
  const p = me.broker === 'custom' ? {url:me.url} : BROKERS[me.broker || 'emqx'], c = new MiniMQTT(p.url, {username:p.username, password:p.password});
  c.onmessage = onMsg; c.onstatus = s => { if (client === c && s !== 'on') { $('#dot').className = 'dot err'; setTimeout(() => { if (client === c) connect(); }, 3000); } };
  try { await c.connect(); client = c; $('#dot').className = 'dot on'; c.subscribe(T('round')); if (me.role === 'integrator') { DEVICES.forEach(d => { alarms[d.id] = false; pub('alarm/' + d.id, {on:false, t:Date.now()}, true); }); c.subscribe(T('data/+')); c.subscribe(T('meta/+')); c.subscribe(T('incident/+')); c.subscribe(T('hello/+')); setTimeout(() => { if (!roundSeen) pub('round', {n:round}, true); }, 1500); } else { c.subscribe(T('alarm/' + me.device)); pub('hello/' + me.device, {name:me.name, t:Date.now()}, true); } }
  catch (e) { $('#dot').className = 'dot err'; setTimeout(connect, 3000); }
}
let roundSeen = false;
function onMsg(topic, payload) {
  let m = null; if (payload) { try { m = JSON.parse(payload); } catch (e) { m = undefined; } }
  const p = topic.split('/'), kind = p[2], id = p[3];
  if (kind === 'round') { if (m && m.n) { round = m.n; roundSeen = true; if (me.role !== 'integrator') { publishMeta(); } render(); } return; }
  if (me.role === 'integrator') {
    if (kind === 'data') { latest[id] = {raw:payload, msg:m, at:Date.now()}; evaluate(id); return; }
    if (kind === 'meta') { if (m) metas[id] = m; else delete metas[id]; evaluate(id); render(); return; }
    if (kind === 'hello') { if (m) hellos[id] = m; else delete hellos[id]; render(); return; }
    if (kind === 'incident' && m) { onIncident(id, m); return; }
  } else if (kind === 'alarm') { plantAlarm = m && m.on; plantAlarmAt = m ? m.t : 0; feedback(); }
}

/* ===== supplier: one device, one problem button ===== */
let value = null, incident = null, plantAlarm = false, plantAlarmAt = 0, sendTimer = null, metaPick = null;
function supplierLoop() {
  const d = dev(me.device); if (value == null) value = d.normal;
  clearInterval(sendTimer);
  sendTimer = setInterval(() => {
    const now = Date.now(), target = incident && now < incident.until ? d.problem : d.normal, span = Math.abs(d.problem - d.normal);
    value += (target - value) * .45 + (Math.random() - .5) * span * .03;
    if (incident && now >= incident.until) { incident = null; pub('incident/' + me.device, {on:false, t:now}); }
    if (Math.floor(now / 1000) % d.period === 0) { const msg = round === 3 ? stdMsg(d, value, now) : d.own(value, now); pub('data/' + me.device, msg); lastMsg = msg; }
    renderSupplierLive();
  }, 1000);
}
let lastMsg = null;
function publishMeta() { if (!me || me.role === 'integrator') return; if (round === 2 && metaPick) pub('meta/' + me.device, metaPick, true); else pub('meta/' + me.device, null, true); }
function feedback() {
  const el = $('#fb'); if (!el) return; const d = dev(me.device);
  if (incident && incident.pre) { el.className = 'fb bad'; el.textContent = 'The plant already showed an alarm before your problem started ✗ An alarm that is always on tells nothing.'; }
  else if (incident) { const seen = plantAlarm && plantAlarmAt >= incident.t - 1500; el.className = 'fb ' + (seen ? 'ok' : 'wait'); el.textContent = seen ? `The plant saw it after ${fmt(Math.max(0, (plantAlarmAt - incident.t) / 1000))} s ✓` : `Waiting. Has the plant noticed? ${fmt((Date.now() - incident.t) / 1000, 0)} s`; if (!seen && Date.now() - incident.t > 10000) { el.className = 'fb bad'; el.textContent = 'Not noticed in 10 s ✗ The problem went unseen.'; } }
  else if (plantAlarm) { el.className = 'fb bad'; el.textContent = 'False alarm ✗ The plant thinks your device has a problem, but it is fine.'; }
  else { el.className = 'fb ok'; el.textContent = 'All quiet. The plant sees no problem, and there is none.'; }
}
function renderSupplierLive() {
  const d = dev(me.device), u = d.q === 'Temperature' ? '°C' : d.q === 'Battery' ? '%' : STD[d.q];
  if ($('#val')) $('#val').innerHTML = `${fmt(value, d.q === 'Speed' ? 2 : d.q === 'Power' ? 0 : 1)} <small>${u}</small>`;
  if ($('#msg') && lastMsg) $('#msg').textContent = JSON.stringify(lastMsg, null, 1);
  if ($('#btnProb')) { $('#btnProb').textContent = incident ? `Problem running, ${Math.max(0, Math.ceil((incident.until - Date.now()) / 1000))} s` : 'Cause a problem'; $('#btnProb').disabled = !!incident; }
  feedback();
}
function supplierView() {
  const d = dev(me.device), fields = fieldsOf(d.own(d.normal, Date.now()));
  if (!metaPick) metaPick = lsGet('cx_meta_' + me.device, null);
  let h = `<div class="grid2"><div><div class="card"><div class="eyebrow">Round ${round} · ${ROUNDS[round][0]}</div><h2>${esc(d.name)}</h2><div class="small muted">${esc(d.sup)}. ${esc(d.habit)}</div>
    <div class="value" id="val" style="margin-top:10px"></div><div class="small muted">${esc(d.q)}. The plant should raise an alarm when it is ${esc(d.ruleTxt)}.</div>
    <button class="btn huge red" id="btnProb" style="margin-top:14px">Cause a problem</button><div id="fb" class="fb ok"></div></div></div>`;
  h += `<div><div class="card"><div class="eyebrow">What your device sends</div><pre id="msg">waiting…</pre><div class="small muted">${round === 3 ? 'Standard message. Same names and units for everyone.' : 'This is your supplier’s own format. You cannot change it.'}</div></div>`;
  if (round === 2) h += `<div class="card"><div class="eyebrow">Describe your data for the plant</div><div class="small muted">Tell the plant which field holds the ${esc(d.q.toLowerCase())} and in which unit. A wrong description gives wrong alarms.</div>
    <label class="f">Field</label><select id="mField"><option value="">choose</option>${fields.map(f => `<option ${metaPick && metaPick.field === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select>
    <label class="f">Unit</label><select id="mUnit"><option value="">choose</option>${UNITS[d.q].map(u => `<option value="${u}" ${metaPick && metaPick.unit === u ? 'selected' : ''}>${UNIT_LABEL[u]}</option>`).join('')}</select>
    <div class="small" id="mState" style="margin-top:8px">${metaPick ? 'Description sent to the plant.' : 'Not described yet.'}</div></div>`;
  h += '</div></div>';
  $('#main').innerHTML = h;
  $('#btnProb').onclick = () => { const now = Date.now(); incident = {t:now, until:now + 25000, pre:!!plantAlarm}; pub('incident/' + me.device, {on:true, t:now}); renderSupplierLive(); };
  if (round === 2) { const upd = () => { const f = $('#mField').value, u = $('#mUnit').value; metaPick = f && u ? {quantity:d.q, field:f, unit:u} : null; lsSet('cx_meta_' + me.device, metaPick); publishMeta(); $('#mState').textContent = metaPick ? 'Description sent to the plant.' : 'Not described yet.'; }; $('#mField').onchange = upd; $('#mUnit').onchange = upd; }
  renderSupplierLive();
}

/* ===== integrator: the plant view ===== */
let latest = {}, metas = {}, hellos = {}, maps = lsGet('cx_maps', {}), alarms = {}, scores = lsGet('cx_scores', {1:null, 2:null, 3:null}), live = {};
function sc() { return scores[round] || (scores[round] = {inc:[], fa:0, faAt:{}, maps:0}); }
function interpret(id) {
  const L = latest[id], d = dev(id); if (!L || !d) return null;
  const m = L.msg; if (!m || typeof m !== 'object') return {how:'unreadable'};
  if (m.quantity && m.unit && m.value != null) return {how:'std', v:toStd(m.value, m.unit)};
  if (round === 3) return {how:'unknown'};   // in the standard round only standard messages count
  if (round >= 2 && metas[id]) return {how:'sup', v:toStd(getPath(m, metas[id].field), metas[id].unit)};
  if (maps[id] && maps[id].field && maps[id].unit) return {how:'you', v:toStd(getPath(m, maps[id].field), maps[id].unit)};
  return {how:'unknown'};
}
function evaluate(id) {
  const d = dev(id), r = interpret(id); live[id] = r;
  const on = !!(r && r.v != null && d && d.rule(r.v)), was = !!alarms[id], now = Date.now();
  if (on !== was) {
    alarms[id] = on; pub('alarm/' + id, {on, t:now}, true);
    const s = sc(), open = s.inc.find(x => x.id === id && !x.end);
    if (on) { if (open && open.caught == null && !open.pre) open.caught = (now - open.t) / 1000; else if (!open) { s.fa++; } }
    lsSet('cx_scores', scores);
  }
  scheduleRender();
}
function onIncident(id, m) {
  const s = sc();
  if (m.on) { s.inc.push({id, t:Date.now(), caught:null, pre:!!alarms[id]}); }   // an alarm that was already on tells nothing
  else { const open = s.inc.find(x => x.id === id && !x.end); if (open) open.end = Date.now(); }
  lsSet('cx_scores', scores); scheduleRender();
}
let rt = null; function scheduleRender() { if (!rt) rt = setTimeout(() => { rt = null; if (document.activeElement && document.activeElement.tagName === 'SELECT') { scheduleRender(); return; } render(); }, 400); }
function scoreRow(n) { const s = scores[n]; if (!s) return `<tr><td>${n}. ${ROUNDS[n][0]}</td><td colspan="4" class="muted">not played</td></tr>`; const tot = s.inc.length, caught = s.inc.filter(x => x.caught != null && x.caught <= 10).length; return `<tr><td>${n}. ${ROUNDS[n][0]}</td><td><b>${caught} of ${tot}</b></td><td>${s.inc.filter(x => x.caught != null).map(x => fmt(x.caught)).join(', ') || '–'}</td><td>${s.fa}</td><td>${s.maps}</td></tr>`; }
function integratorView() {
  const ids = DEVICES.map(d => d.id).filter(id => latest[id] || hellos[id]);
  let h = `<div class="card"><div class="eyebrow">Integrator · team ${esc(me.team)}</div><h2>Make the plant view catch every problem</h2><div class="small muted">Suppliers cause problems on their devices. Your plant view must raise the alarm within 10 seconds, without false alarms. Play the three rounds and compare.</div>
    <div class="rounds" style="margin-top:10px">${[1, 2, 3].map(n => `<button data-n="${n}" class="${round === n ? 'on' : ''}"><b>Round ${n} · ${ROUNDS[n][0]}</b><span>${ROUNDS[n][1]}</span></button>`).join('')}</div></div>`;
  h += `<div class="grid2"><div class="card"><div class="eyebrow">Plant view</div><div class="tiles" style="margin-top:8px">${ids.map(id => { const d = dev(id), r = live[id], on = alarms[id], unk = !r || r.v == null; const tag = r && r.how === 'std' ? '<span class="tag std">standard</span>' : r && r.how === 'sup' ? '<span class="tag sup">described by supplier</span>' : r && r.how === 'you' ? '<span class="tag you">translated by you</span>' : '<span class="tag">not understood</span>'; return `<div class="tile ${on ? 'alarm' : unk ? 'unk' : ''}"><div class="row"><b>${esc(d.name)}</b><span class="small muted" style="margin-left:auto">${esc(hellos[id] ? hellos[id].name : '')}</span></div><div class="v">${unk ? '?' : fmt(r.v, d.q === 'Speed' ? 2 : d.q === 'Power' ? 0 : 1) + ' ' + (UNIT_LABEL[STD[d.q]] || STD[d.q])}</div><div class="st" style="color:${on ? '#b3321f' : unk ? '#6b7785' : '#14633a'}">${on ? 'ALARM, ' + esc(d.ruleTxt) : unk ? 'cannot check' : 'OK'}</div><div style="margin-top:4px">${tag}</div></div>`; }).join('') || '<div class="muted">Waiting for suppliers to connect.</div>'}</div></div>`;
  h += `<div><div class="card"><div class="eyebrow">Score per round</div><table style="margin-top:6px"><tr><th>Round</th><th>Caught in 10 s</th><th>Seconds to alarm</th><th>False alarms</th><th>Your translations</th></tr>${[1, 2, 3].map(scoreRow).join('')}</table><div class="row" style="margin-top:8px"><button class="btn ghost" id="clrScore">Clear scores</button></div></div>`;
  const needMap = ids.filter(id => { const r = live[id]; return round === 1 || (r && r.how !== 'std' && r.how !== 'sup'); });
  if (round < 3 && needMap.length) h += `<div class="card"><div class="eyebrow">${round === 1 ? 'Translate each supplier' : 'Not described yet, translate it yourself'}</div><div class="small muted">Choose the field that holds the value and its unit. The plant view converts to the standard.</div>${needMap.map(id => { const d = dev(id), L = latest[id], fs = L && L.msg && typeof L.msg === 'object' ? fieldsOf(L.msg) : [], mp = maps[id] || {}; return `<div style="margin-top:10px"><b>${esc(d.name)}</b> <span class="small muted">${esc(d.q)} in ${esc(UNIT_LABEL[STD[d.q]])}</span><div class="row" style="margin-top:4px"><select data-mf="${id}" style="width:auto;flex:1"><option value="">field</option>${fs.map(f => `<option ${mp.field === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select><select data-mu="${id}" style="width:auto;flex:1"><option value="">unit</option>${UNITS[d.q].map(u => `<option value="${u}" ${mp.unit === u ? 'selected' : ''}>${UNIT_LABEL[u]}</option>`).join('')}</select></div><pre style="font-size:11px">${esc(L ? L.raw : 'no message yet')}</pre></div>`; }).join('')}</div>`;
  h += '</div></div>';
  $('#main').innerHTML = h;
  $$('.rounds button').forEach(b => b.onclick = () => { round = +b.dataset.n; pub('round', {n:round}, true); render(); });
  $('#clrScore').onclick = () => { scores = {1:null, 2:null, 3:null}; lsSet('cx_scores', scores); render(); };
  const upd = id => { const f = $(`[data-mf="${id}"]`).value, u = $(`[data-mu="${id}"]`).value, old = maps[id] || {}; if (f && u && (old.field !== f || old.unit !== u)) sc().maps++; maps[id] = {field:f, unit:u}; lsSet('cx_maps', maps); lsSet('cx_scores', scores); evaluate(id); };
  $$('[data-mf]').forEach(s => s.onchange = () => upd(s.dataset.mf)); $$('[data-mu]').forEach(s => s.onchange = () => upd(s.dataset.mu));
}

/* ===== join ===== */
function joinView() {
  let role = me ? me.role : 'supplier', device = me ? me.device : 'freezer';
  $('#main').innerHTML = `<div class="card"><div class="eyebrow">Join your team</div><h2>One integrator, everyone else a supplier</h2>
    <div class="row"><div style="flex:1;min-width:140px"><label class="f">Team code</label><input type="text" id="jTeam" placeholder="for example c1" value="${esc(me ? me.team : params.get('team') || '')}"></div><div style="flex:1;min-width:140px"><label class="f">Your name</label><input type="text" id="jName" value="${esc(me ? me.name : '')}"></div></div>
    <label class="f">Your role</label><div class="pick" id="jRole"><button data-r="supplier"><b>Supplier</b><span>you own one device on the shop floor</span></button><button data-r="integrator"><b>Integrator</b><span>you run the plant view on a laptop</span></button></div>
    <div id="jDevBox"><label class="f">Your device</label><div class="pick" id="jDev">${DEVICES.map(d => `<button data-d="${d.id}"><b>${esc(d.name)}</b><span>${esc(d.sup)}. ${esc(d.habit)}</span></button>`).join('')}</div></div>
    <label class="f">Server</label><select id="jBroker"><option value="emqx">Server A</option><option value="hivemq">Server B</option><option value="mosq">Server C</option><option value="shiftr">Server D, port 443</option><option value="custom">Own server URL</option></select><input type="text" id="jUrl" class="hide" placeholder="ws://192.168.1.10:9001" style="margin-top:6px">
    <div style="margin-top:14px"><button class="btn huge" id="jGo">Join</button></div><div class="small muted" style="margin-top:8px">Each device once per team. The integrator opens this page on a laptop or the projector.</div></div>`;
  const sync = () => { $$('#jRole button').forEach(b => b.classList.toggle('on', b.dataset.r === role)); $$('#jDev button').forEach(b => b.classList.toggle('on', b.dataset.d === device)); $('#jDevBox').classList.toggle('hide', role !== 'supplier'); };
  $$('#jRole button').forEach(b => b.onclick = () => { role = b.dataset.r; sync(); }); $$('#jDev button').forEach(b => b.onclick = () => { device = b.dataset.d; sync(); }); sync();
  $('#jBroker').value = (me && me.broker) || params.get('b') || 'emqx'; $('#jUrl').value = (me && me.url) || params.get('url') || '';
  $('#jBroker').onchange = () => $('#jUrl').classList.toggle('hide', $('#jBroker').value !== 'custom'); $('#jBroker').onchange();
  $('#jGo').onclick = () => { const team = $('#jTeam').value.trim().toLowerCase().replace(/[^\w-]/g, ''), name = $('#jName').value.trim(); if (!team || !name) return; me = {team, name, role, device, broker:$('#jBroker').value, url:$('#jUrl').value.trim()}; lsSet('cx_me', me); start(); };
}
function render() {
  if (!me) { joinView(); return; }
  $('#whoText').innerHTML = `${esc(me.name)} · ${esc(me.team)} · <a href="#" id="chg" style="color:#c9d7ea">change</a>`; $('#chg').onclick = e => { e.preventDefault(); clearInterval(sendTimer); if (client) client.close(); client = null; joinView(); };
  if (me.role === 'integrator') integratorView(); else supplierView();
}
function start() { render(); connect(); if (me.role !== 'integrator') supplierLoop(); else setInterval(() => { Object.keys(latest).forEach(id => { if (Date.now() - latest[id].at > 12000 && alarms[id]) { alarms[id] = false; pub('alarm/' + id, {on:false, t:Date.now()}, true); } }); }, 3000); }
if (me) start(); else joinView();
</script>
</body>
</html>
