<style>
:root{--ink:#16212e;--muted:#4a5563;--bg:#f4f3ee;--line:#d6dce3;--kth:#004791;--navy:#000061;--soft:#e6eef8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
header{background:var(--navy);color:#fff;padding:12px 16px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

.who{margin-left:auto;font-size:13px;color:#c9d7ea;text-align:right}
.dot{width:10px;height:10px;border-radius:99px;background:#9aa6b2;display:inline-block;margin-right:6px}.dot.on{background:#2fbf71}.dot.err{background:#e5484d}

.muted{color:var(--muted)}.small{font-size:13px}
h2{font-size:21px;margin:4px 0 8px}
.btn{background:var(--kth);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--kth);border:1.5px solid var(--kth)}
.btn.red{background:#c4422b}.btn.go{background:#1f9d5a}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.huge{width:100%;font-size:22px;padding:20px;border-radius:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],select{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;width:100%}
label.f{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:10px 0 4px}

.pick button b{display:block}.pick button span{font-size:12px;color:var(--muted)}

.value{font-size:48px;font-weight:900;line-height:1.05}

.tile.unk{background:#f2f3f5}

.big{font-size:26px;font-weight:900}

.check{border-radius:10px;padding:10px;margin-top:10px;font-weight:700;font-size:14px}
.check.ok{background:#e5f3ea;color:#14633a}.check.bad{background:#fae6e4;color:#b3321f}.check.wait{background:#f2f3f5;color:#4a5563}

.tile pre.raw{font-size:12px;margin:6px 0 2px;max-height:130px}
.rawline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#6b7785;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .v.dim{color:#9aa6b2}
.warn{color:#b3321f;font-weight:700;font-size:13px;margin-top:2px}
.flash{font-weight:800;font-size:14px;margin-top:6px;min-height:20px}
.flash.ok{color:#14633a}.flash.bad{color:#b3321f}.flash.mid{color:#8a5a00}
.tag.bad{background:#fae6e4;color:#b3321f}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.hide{display:none!important}
@media(max-width:860px){.grid2{grid-template-columns:1fr}.rounds{grid-template-columns:1fr}}

<header>

<main id="main"></main>
<script>
/* ===== minimal MQTT 3.1.1 over WebSocket ===== */
class MiniMQTT {
  constructor(url, o = {}) { this.url = url; this.o = o; this.buf = new Uint8Array(0); this.subs = []; this.pid = 1; this.enc = new TextEncoder(); this.dec = new TextDecoder(); }
  _s(str) { const b = this.enc.encode(str); return [b.length >> 8, b.length & 255, ...b]; }
  _len(n) { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return o; }
  _send(h, body) { if (!this.ws || this.ws.readyState !== 1) return false; this.ws.send(new Uint8Array([h, ...this._len(body.length), ...body])); return true; }
  connect() { return new Promise((res, rej) => { let done = false; const fail = e => { if (!done) { done = true; rej(e); } };
    try { this.ws = new WebSocket(this.url, ['mqtt']); } catch (e) { return fail(e); }
    this.ws.binaryType = 'arraybuffer'; const to = setTimeout(() => { fail(new Error('timeout')); try { this.ws.close(); } catch (e) {} }, 8000);
    this.ws.onopen = () => { let f = 0x02; const pl = this._s('ml2305-' + Math.random().toString(36).slice(2, 10)); if (this.o.username) { f |= 0x80; pl.push(...this._s(this.o.username)); } if (this.o.password) { f |= 0x40; pl.push(...this._s(this.o.password)); } this._send(0x10, [...this._s('MQTT'), 4, f, 0, 30, ...pl]); this._ping = setInterval(() => this._send(0xC0, []), 20000); };
    this.ws.onmessage = ev => { const d = new Uint8Array(ev.data), nb = new Uint8Array(this.buf.length + d.length); nb.set(this.buf); nb.set(d, this.buf.length); this.buf = nb;
      for (;;) { if (this.buf.length < 2) break; let m = 1, len = 0, i = 1, b; do { if (i >= this.buf.length) return; b = this.buf[i++]; len += (b & 127) * m; m *= 128; } while (b & 128); if (this.buf.length < i + len) break;
        const h = this.buf[0], body = this.buf.slice(i, i + len); this.buf = this.buf.slice(i + len); const t = h >> 4;
        if (t === 2) { clearTimeout(to); if (body[1] === 0) { done = true; this.subs.forEach(s => this._sub(s)); res(); this.onstatus && this.onstatus('on'); } else fail(new Error('refused')); }
        else if (t === 3) { const q = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = this.dec.decode(body.slice(2, 2 + tl)); let p = 2 + tl; if (q > 0) { const id = [body[p], body[p + 1]]; p += 2; if (q === 1) this._send(0x40, id); } this.onmessage && this.onmessage(topic, this.dec.decode(body.slice(p))); } } };
    this.ws.onerror = () => { fail(new Error('error')); this.onstatus && this.onstatus('err'); };
    this.ws.onclose = () => { clearInterval(this._ping); this.onstatus && this.onstatus(done ? 'closed' : 'err'); fail(new Error('closed')); }; }); }
  _sub(f) { const id = this.pid++ & 0xffff; this._send(0x82, [id >> 8, id & 255, ...this._s(f), 0]); }
  subscribe(f) { if (!this.subs.includes(f)) this.subs.push(f); this._sub(f); }
  publish(t, p, retain) { return this._send(retain ? 0x31 : 0x30, [...this._s(t), ...this.enc.encode(p)]); }

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const fmt = (v, d = 1) => v == null || isNaN(v) ? '–' : (+v).toFixed(d);

/* ===== the shared standard: one name and one unit per quantity ===== */
const STD = {Temperature:'degC', Battery:'percent', Speed:'m/s', Weight:'kg', Power:'W'};
const UNITS = {Temperature:['degC', 'degF', 'K'], Battery:['percent', 'fraction'], Speed:['m/s', 'mm/s'], Weight:['kg', 'g'], Power:['W', 'kW']};
const UNIT_LABEL = {degC:'°C', degF:'°F', K:'K', percent:'%', fraction:'0 to 1', 'm/s':'m/s', 'mm/s':'mm/s', kg:'kg', g:'g', W:'W', kW:'kW'};
function toStd(v, unit) { v = parseFloat(v); if (isNaN(v)) return null; switch (unit) { case 'degF': return (v - 32) * 5 / 9; case 'K': return v - 273.15; case 'fraction': return v * 100; case 'mm/s': return v / 1000; case 'g': return v / 1000; case 'kW': return v * 1000; default: return v; } }
/* every device has one quantity, one alarm rule in standard units, and the habits of its supplier */
const DEVICES = [
  {id:'freezer', name:'Freezer', sup:'Nordtemp AB', q:'Temperature', normal:-19, problem:-4, rule:v => v > -15, ruleTxt:'warmer than −15 °C', habit:'American firmware. Fahrenheit, local time.', own:(v, t) => ({dev:'NT-204', tempF:+(v * 9 / 5 + 32).toFixed(1), time:local(t)}), field:'tempF', unit:'degF', period:1},
  {id:'amr', name:'Mobile robot', sup:'RoboMove GmbH', q:'Battery', normal:78, problem:9, rule:v => v < 15, ruleTxt:'battery under 15 %', habit:'Battery as a fraction, Unix seconds.', own:(v, t) => ({robot:'MiR-2', bat:+(v / 100).toFixed(3), mode:'moving', ts:Math.floor(t / 1000)}), field:'bat', unit:'fraction', period:1},
  {id:'conveyor', name:'Conveyor', sup:'BeltCo', q:'Speed', normal:.5, problem:0, rule:v => v < .1, ruleTxt:'slower than 0.1 m/s', habit:'Everything is a string, millimetres per second.', own:(v, t) => ({id:'CV-1', running:v > .05 ? 'true' : 'false', speed_mm_s:String(Math.round(v * 1000)), t:String(t)}), field:'speed_mm_s', unit:'mm/s', period:1},
  {id:'shelf', name:'Smart shelf', sup:'Shelfie Sverige', q:'Weight', normal:4.6, problem:.3, rule:v => v < 1, ruleTxt:'lighter than 1 kg, refill', habit:'Swedish field names, grams, no time.', own:v => ({hylla:'S3', vikt:Math.round(v * 1000), antal:Math.round(v / .2)}), field:'vikt', unit:'g', period:1},
  {id:'robotcell', name:'Robot cell', sup:'ArmTech', q:'Power', normal:900, problem:3300, rule:v => v > 2500, ruleTxt:'more than 2500 W', habit:'Nested JSON, kilowatts, ISO time.', own:(v, t) => ({asset:{id:'UR5e-1'}, power:{value:+(v / 1000).toFixed(2), unit:'kW'}, timestamp:new Date(t).toISOString()}), field:'power.value', unit:'kW', period:1},
  {id:'meter', name:'Energy meter', sup:'VoltView', q:'Power', normal:3100, problem:6400, rule:v => v > 5000, ruleTxt:'more than 5000 W', habit:'Kilowatts, sends only every 4 s.', own:(v, t) => ({meter:'EM-9', P_kW:+(v / 1000).toFixed(2), date:local(t)}), field:'P_kW', unit:'kW', period:4}
];
const dev = id => DEVICES.find(d => d.id === id);
function local(t) { const d = new Date(t), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function fieldsOf(o, pre = '') { const out = []; for (const [k, v] of Object.entries(o || {})) { const p = pre ? pre + '.' + k : k; if (v && typeof v === 'object') out.push(...fieldsOf(v, p)); else out.push(p); } return out; }
const getPath = (o, p) => p.split('.').reduce((a, k) => a == null ? undefined : a[k], o);
function stdMsg(d, v, t) { return {assetId:'urn:kth:lab:' + d.id, quantity:d.q, value:+v.toFixed(3), unit:STD[d.q], time:new Date(t).toISOString()}; }
/* how a supplier can send its data. The supplier decides, the plant has to live with it */
const MODES = {own:['Own format', 'What the device always sends. The plant has to work out the field and the unit.'], desc:['Own format + description', 'The same message, plus a description of which field holds the value and in which unit.'], std:['Standard', 'The same names and units as every other device.']};
const RANGE = {freezer:[-40, 30], amr:[0, 100], conveyor:[0, 3], shelf:[0, 10], robotcell:[0, 8000], meter:[0, 20000]};
const decs = d => d.q === 'Speed' ? 2 : d.q === 'Power' ? 0 : 1;
const fmtV = (d, v) => v == null || isNaN(v) ? '?' : `${(+v).toFixed(decs(d))} ${UNIT_LABEL[STD[d.q]]}`;
const numOf = x => typeof x === 'number' ? x : typeof x === 'string' && x.trim() !== '' && !isNaN(+x) ? +x : NaN;
const isStd = m => !!(m && typeof m === 'object' && m.quantity && m.unit && m.value != null);
const UNIT_TEXT = {kW:'kW', W:'W', '°C':'degC', degC:'degC', '°F':'degF', degF:'degF', K:'K', '%':'percent', 'm/s':'m/s', 'mm/s':'mm/s', kg:'kg', g:'g'};
/* what the plant can check in a description without asking anyone */
function hintFor(field, msg, d) {
  const parts = field.split('.'), name = parts[parts.length - 1], last = name.toLowerCase();
  const sib = parts.length > 1 ? getPath(msg, parts.slice(0, -1).concat('unit').join('.')) : undefined;
  if (typeof sib === 'string' && last !== 'unit' && UNIT_TEXT[sib]) return {unit:UNIT_TEXT[sib], txt:`the message itself says ${sib}`};
  if (/tempf|fahr|(^|_)f$/.test(last)) return {unit:'degF', txt:'the field name says °F'};
  if (/mm_?s$|mm\/s/.test(last)) return {unit:'mm/s', txt:'the field name says mm/s'};
  if (/kw/.test(last)) return {unit:'kW', txt:'the field name says kW'};
  if (/antal|count|qty|pcs/.test(last)) return {bad:`“${name}” looks like a count, not ${d.q.toLowerCase()}`};
  if (/^(ts|t|time|timestamp|date)$/.test(last)) return {bad:`“${name}” looks like a time, not ${d.q.toLowerCase()}`};
  return null;
}
function readDesc(id, msg, meta) {
  const d = dev(id); if (!msg || typeof msg !== 'object') return {v:null, why:'The message is not readable.'};
  const raw = getPath(msg, meta.field);
  if (raw === undefined) return {v:null, why:`There is no field “${meta.field}” in the message.`};
  const num = numOf(raw); if (isNaN(num)) return {v:null, why:`“${meta.field}” is not a number.`};
  const v = toStd(num, meta.unit), h = hintFor(meta.field, msg, d);
  if (h && h.bad) return {v, why:h.bad + '.'};
  if (h && h.unit && h.unit !== meta.unit) return {v, why:`The description says ${UNIT_LABEL[meta.unit]}, but ${h.txt}.`};
  const [lo, hi] = RANGE[id]; if (v < lo || v > hi) return {v, why:`${fmtV(d, v)} is not possible for a ${d.name.toLowerCase()}.`};

  return {v, ok:true};

/* ===== connection ===== */
const BROKERS = {emqx:{url:'wss://broker.emqx.io:8084/mqtt'}, hivemq:{url:'wss://broker.hivemq.com:8884/mqtt'}, mosq:{url:'wss://test.mosquitto.org:8081/'}, shiftr:{url:'wss://public.cloud.shiftr.io', username:'public', password:'public'}};
let me = lsGet('cx_me', null), client = null;
const T = s => `ml2305/cx-${me.team}/${s}`;
function pub(s, o, retain) { if (client) client.publish(T(s), o == null ? '' : JSON.stringify(o), !!retain); }
async function connect() {
  if (client) client.close(); client = null; $('#dot').className = 'dot';
  const p = me.broker === 'custom' ? {url:me.url} : BROKERS[me.broker || 'emqx'], c = new MiniMQTT(p.url, {username:p.username, password:p.password});
  c.onmessage = onMsg; c.onstatus = s => { if (client === c && s !== 'on') { $('#dot').className = 'dot err'; setTimeout(() => { if (client === c) connect(); }, 3000); } };
  try {
    await c.connect(); client = c; $('#dot').className = 'dot on';
    if (me.role === 'integrator') { DEVICES.forEach(d => pub('alarm/' + d.id, null, true)); ['data/+', 'meta/+', 'incident/+', 'hello/+'].forEach(s => c.subscribe(T(s))); }

function onMsg(topic, payload) {
  let m = null; if (payload) { try { m = JSON.parse(payload); } catch (e) { m = undefined; } }
  const p = topic.split('/'), kind = p[2], id = p[3];
  if (me.role === 'integrator') {
    if (!dev(id)) return;
    if (kind === 'data') { latest[id] = {raw:payload, msg:m, at:Date.now()}; ensureTile(id); updateTile(id); }
    else if (kind === 'meta') { if (m && m.field && m.unit) metas[id] = m; else delete metas[id]; if (tileEl(id)) updateTile(id); }
    else if (kind === 'hello') { if (m) hellos[id] = m; else delete hellos[id]; if (m) ensureTile(id); if (tileEl(id)) updateTile(id); }
    else if (kind === 'incident' && m) onIncident(id, m);
  } else if (kind === 'alarm' && m && typeof m.ok === 'boolean') onAlarm(m);
  else if (kind === 'ask' && m && m.kind) { ask = {kind:m.kind, why:m.why || '', at:Date.now()}; renderAsk(); }
}

/* ===== supplier: one device, it decides how to send, it can break ===== */
let value = null, incident = null, sendTimer = null, lastMsg = null, lastTrue = null, ask = null, result = null, mode = 'own', metaPick = null;
const GRACE = 5000;
function hello() { pub('hello/' + me.device, {name:me.name, mode, t:Date.now()}, true); }
function publishMeta() { if (!me || me.role === 'integrator') return; pub('meta/' + me.device, mode === 'desc' && metaPick ? metaPick : null, true); }
function supplierLoop() {
  const d = dev(me.device); if (value == null) value = d.normal;
  clearInterval(sendTimer);
  sendTimer = setInterval(() => {
    const now = Date.now(), target = incident && !incident.end ? d.problem : d.normal, span = Math.abs(d.problem - d.normal);
    value += (target - value) * .45 + (Math.random() - .5) * span * .03;
    if (incident && !incident.end && now >= incident.until) { incident.end = now; pub('incident/' + me.device, {on:false, t:now}); }
    if (incident && incident.end && now - incident.end > GRACE) { if (incident.caught == null) result = {kind:'missed', at:now}; incident = null; }

function feedback() {

  const set = (c, t) => { el.className = 'fb ' + c; el.textContent = t; };
  if (incident && incident.caught != null) set(incident.caught <= 10 ? 'ok' : 'wait', `The plant raised the alarm after ${fmt(incident.caught)} s ${incident.caught <= 10 ? '✓' : ', too late'}`);
  else if (incident) { const s = (now - incident.t) / 1000; s > 10 ? set('bad', `Not noticed in 10 s ✗ The problem is still unseen, ${fmt(s, 0)} s.`) : set('wait', `Problem running. Has the plant noticed? ${fmt(s, 0)} s`); }
  else if (result && now - result.at < 12000) {
    if (result.kind === 'caught') set(result.secs <= 10 ? 'ok' : 'wait', `The plant raised the alarm after ${fmt(result.secs)} s ${result.secs <= 10 ? '✓' : ', too late'}`);
    else if (result.kind === 'missed') set('bad', 'The plant never raised the alarm ✗ Your problem went unseen.');
    else set('bad', 'False alarm ✗ The plant raised an alarm, but your device is fine.');
  } else set('ok', 'All quiet. No problem, no alarm.');
}
function renderAsk() {
  const el = $('#ask'); if (!el) return;
  if (!ask || Date.now() - ask.at > 40000) { el.classList.add('hide'); return; }
  el.classList.remove('hide');
  el.innerHTML = ask.kind === 'describe' ? 'The plant cannot read your format. It asks for a description, or for the standard.' : `The plant says your description does not fit your data. ${esc(ask.why)}`;
}
function renderSupplierLive() {
  const d = dev(me.device), u = d.q === 'Temperature' ? '°C' : d.q === 'Battery' ? '%' : STD[d.q];
  if ($('#val')) $('#val').innerHTML = `${fmt(value, decs(d))} <small>${u}</small>`;
  if ($('#msg') && lastMsg) $('#msg').textContent = JSON.stringify(lastMsg, null, 1);
  if ($('#btnProb')) { $('#btnProb').textContent = incident && !incident.end ? `Problem running, ${Math.max(0, Math.ceil((incident.until - Date.now()) / 1000))} s` : 'Cause a problem'; $('#btnProb').disabled = !!incident; }
  const ck = $('#mCheck');
  if (ck) {
    if (mode === 'own') { ck.className = 'check wait'; ck.textContent = 'The plant only gets the raw message. Someone there has to work out which field is the value and in which unit.'; }
    else if (mode === 'std') { ck.className = 'check ok'; ck.textContent = 'Standard message ✓ The plant reads it directly, like every other device.'; }
    else if (!metaPick) { ck.className = 'check wait'; ck.textContent = 'Pick the field and the unit. Until then the plant only gets the raw message.'; }
    else if (lastMsg) {
      const r = readDesc(me.device, lastMsg, metaPick), tol = Math.max(.02 * Math.abs(d.problem - d.normal), .01), right = r.v != null && Math.abs(r.v - lastTrue) <= tol;
      ck.className = 'check ' + (right ? 'ok' : 'bad');
      ck.innerHTML = (right ? `✓ The plant reads your ${esc(d.name.toLowerCase())} right, ${esc(fmtV(d, r.v))}.` : r.v == null ? `✗ Your description is wrong. The plant cannot read a number from “${esc(metaPick.field)}”.` : `✗ Your description is wrong. The plant reads ${esc(fmtV(d, r.v))}, but your ${esc(d.name.toLowerCase())} is at ${esc(fmtV(d, lastTrue))}.`) + (!r.ok && r.why ? `<div class="small" style="font-weight:600;margin-top:4px">The plant also sees a warning. ${esc(r.why)}</div>` : '');
    }
  }
  if ($('#metaPre')) $('#metaPre').textContent = mode === 'desc' && metaPick ? 'description ' + JSON.stringify(metaPick) : '';
  feedback(); renderAsk();
}
function supplierView() {
  const d = dev(me.device), fields = fieldsOf(d.own(d.normal, Date.now()));
  mode = lsGet('cx_mode_' + me.device, mode); if (!metaPick) metaPick = lsGet('cx_meta_' + me.device, null);
  let h = `<div class="grid2"><div><div class="card"><div class="eyebrow">Your device</div><h2>${esc(d.name)}</h2><div class="small muted">${esc(d.sup)}. ${esc(d.habit)}</div>
    <div class="value" id="val" style="margin-top:10px"></div><div class="small muted">${esc(d.q)}. The plant should raise an alarm when it is ${esc(d.ruleTxt)}.</div>
    <button class="btn huge red" id="btnProb" style="margin-top:14px">Cause a problem</button><div id="fb" class="fb ok"></div></div></div>`;
  h += `<div><div class="card"><div class="eyebrow">How your device sends its data</div><div class="modes" id="modes">${Object.entries(MODES).map(([k, [t, s]]) => `<button data-m="${k}" class="${mode === k ? 'on' : ''}"><b>${t}</b><span>${s}</span></button>`).join('')}</div>`;
  if (mode === 'desc') h += `<div class="lbl">Your description</div><div class="small muted">Which field holds the ${esc(d.q.toLowerCase())}, and in which unit?</div><div class="row" style="margin-top:6px"><select id="mField" style="flex:1;width:auto"><option value="">field</option>${fields.map(f => `<option ${metaPick && metaPick.field === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}</select><select id="mUnit" style="flex:1;width:auto"><option value="">unit</option>${UNITS[d.q].map(u => `<option value="${u}" ${metaPick && metaPick.unit === u ? 'selected' : ''}>${UNIT_LABEL[u]}</option>`).join('')}</select></div>`;
  h += `<div class="check wait" id="mCheck"></div><div class="banner hide" id="ask"></div><div class="lbl">What the plant receives</div><pre id="msg">waiting…</pre><pre id="metaPre"></pre></div></div></div>`;
  $('#main').innerHTML = h;
  $('#btnProb').onclick = () => { if (incident) return; const now = Date.now(); incident = {t:now, until:now + 25000, caught:null}; result = null; pub('incident/' + me.device, {on:true, t:now}); renderSupplierLive(); };
  $$('#modes button').forEach(b => b.onclick = () => { if (mode === b.dataset.m) return; mode = b.dataset.m; lsSet('cx_mode_' + me.device, mode); ask = null; publishMeta(); hello(); supplierView(); });
  if (mode === 'desc') { const upd = () => { const f = $('#mField').value, u = $('#mUnit').value; metaPick = f && u ? {quantity:d.q, field:f, unit:u} : null; lsSet('cx_meta_' + me.device, metaPick); ask = null; publishMeta(); renderSupplierLive(); }; $('#mField').onchange = upd; $('#mUnit').onchange = upd; }
  renderSupplierLive();
}

/* ===== integrator: the plant view. It reads what comes in and decides when to raise the alarm ===== */
const FMT_NAME = {own:'Own format', desc:'Described', std:'Standard'};
const freshScore = () => ({own:{n:0, caught:0, secs:[], missed:0, fa:0}, desc:{n:0, caught:0, secs:[], missed:0, fa:0}, std:{n:0, caught:0, secs:[], missed:0, fa:0}});
let latest = {}, metas = {}, hellos = {}, inc = {}, flash = {}, score = lsGet('cx_score3', null) || freshScore();
const tileEl = id => document.getElementById('t-' + id);
function fmtOf(id) { const L = latest[id]; return L && isStd(L.msg) ? 'std' : metas[id] ? 'desc' : 'own'; }
function tileState(id) {
  const L = latest[id]; if (!L) return {how:'none'};
  if (isStd(L.msg)) return {how:'std', v:toStd(L.msg.value, L.msg.unit)};
  if (metas[id]) { const r = readDesc(id, L.msg, metas[id]); return {how:'desc', v:r.v, ok:!!r.ok, why:r.why}; }
  return {how:'own'};
}
function onIncident(id, m) {
  const now = Date.now();
  if (m.on) { const f = fmtOf(id); inc[id] = {t:now, fmt:f, caught:null, end:null}; score[f].n++; }
  else if (inc[id]) inc[id].end = now;
  lsSet('cx_score3', score); renderScore(); if (tileEl(id)) updateTile(id);
}
function raiseAlarm(id) {
  const now = Date.now(), o = inc[id];
  if (flash[id] && now - flash[id].at < 1200 && flash[id].kind !== 'asked') return;
  if (o && (o.end == null || now - o.end < GRACE)) {
    if (o.caught != null) flash[id] = {kind:'dup', at:now};
    else { const secs = (now - o.t) / 1000, s = score[o.fmt]; o.caught = secs; s.secs.push(+secs.toFixed(1)); if (secs <= 10) s.caught++; flash[id] = {kind:'caught', secs, at:now}; pub('alarm/' + id, {ok:true, secs:+secs.toFixed(1), t:now}); }
  } else { score[fmtOf(id)].fa++; flash[id] = {kind:'false', at:now}; pub('alarm/' + id, {ok:false, t:now}); }
  lsSet('cx_score3', score); updateTile(id); renderScore();
}
function askSupplier(id) { const r = tileState(id); pub('ask/' + id, {kind:r.how === 'own' ? 'describe' : 'fix', why:r.why || '', t:Date.now()}); flash[id] = {kind:'asked', at:Date.now()}; updateTile(id); }
function ensureTile(id) {
  if (tileEl(id) || !$('#tiles')) return;
  const d = dev(id), el = document.createElement('div'); el.className = 'tile'; el.id = 't-' + id; el.style.order = DEVICES.indexOf(d);
  el.innerHTML = `<div class="row"><b>${esc(d.name)}</b><span class="tag" data-r="tag"></span><span class="small muted" data-r="who" style="margin-left:auto"></span></div><div class="cond">Alarm when ${esc(d.ruleTxt)}</div><div data-r="body"></div><div class="row" style="margin-top:8px"><button class="btn red" data-alarm="${id}">Raise alarm</button><a href="#" class="small" data-ask="${id}"></a></div><div class="flash" data-r="flash"></div>`;
  el.querySelector('[data-alarm]').onclick = () => raiseAlarm(id);
  el.querySelector('[data-ask]').onclick = e => { e.preventDefault(); askSupplier(id); };
  $('#tiles').appendChild(el); const w = $('#tilesWait'); if (w) w.remove();
}
function updateTile(id) {
  const el = tileEl(id); if (!el) return; const d = dev(id), L = latest[id], r = tileState(id), now = Date.now(), q = s => el.querySelector(`[data-r="${s}"]`);
  q('who').textContent = hellos[id] ? hellos[id].name : '';
  const tag = q('tag'); tag.className = 'tag ' + (r.how === 'std' ? 'std' : r.how === 'desc' ? (r.ok ? 'sup' : 'bad') : '');
  tag.textContent = r.how === 'std' ? 'standard' : r.how === 'desc' ? (r.ok ? 'described' : 'described, does not fit') : r.how === 'own' ? 'own format' : 'no data';
  let b = '';
  if (r.how === 'none') b = '<div class="small muted" style="margin-top:6px">No data yet.</div>';
  else if (r.how === 'std') b = `<div class="v">${esc(fmtV(d, r.v))}</div><div class="small muted">standard message</div>`;
  else if (r.how === 'desc' && r.ok) b = `<div class="v">${esc(fmtV(d, r.v))}</div><div class="small muted">${esc(metas[id].field)} ${metas[id].unit === 'fraction' ? 'as a fraction' : 'in ' + esc(UNIT_LABEL[metas[id].unit])}, from the supplier’s description</div><div class="rawline">${esc(L.raw)}</div>`;
  else if (r.how === 'desc') b = `<div class="v dim">${r.v == null ? '?' : esc(fmtV(d, r.v)) + ' ?'}</div><div class="warn">⚠ ${esc(r.why)}</div><div class="rawline">${esc(L.raw)}</div>`;
  else b = `<pre class="raw">${esc(L.raw)}</pre><div class="small muted">No description. Read the raw message yourself.</div>`;
  if (L && now - L.at > 10000) b += `<div class="warn">No data for ${Math.round((now - L.at) / 1000)} s.</div>`;
  const body = q('body'); if (body.innerHTML !== b) body.innerHTML = b;
  const a = el.querySelector('[data-ask]'), askTxt = r.how === 'own' ? 'Ask for a description' : r.how === 'desc' && !r.ok ? 'Tell the supplier it does not fit' : '';
  a.textContent = askTxt; a.classList.toggle('hide', !askTxt);
  const f = flash[id], fl = q('flash'), age = f ? now - f.at : 1e9;
  if (f && age < 7000) {
    const t = {caught:f.secs <= 10 ? [`✓ Real problem. Alarm after ${fmt(f.secs)} s.`, 'ok'] : [`✓ Real problem, but late. Alarm after ${fmt(f.secs)} s.`, 'mid'], dup:['The alarm for this problem is already raised.', 'mid'], false:['✗ False alarm. The device is fine.', 'bad'], missed:['✗ A problem here went unnoticed.', 'bad'], asked:['Message sent to the supplier.', 'mid']}[f.kind];
    fl.className = 'flash ' + t[1]; fl.textContent = t[0];
  } else { fl.className = 'flash'; fl.textContent = ''; }
  const o = inc[id]; el.classList.toggle('alarm', !!(o && o.caught != null));
}
function renderScore() {
  const tb = $('#scoreTbl'); if (!tb) return;
  tb.innerHTML = '<tr><th>Data came as</th><th>Problems</th><th>Caught in 10 s</th><th>Average time</th><th>Missed</th><th>False alarms</th></tr>' + Object.keys(FMT_NAME).map(k => { const s = score[k], avg = s.secs.length ? s.secs.reduce((a, b) => a + b, 0) / s.secs.length : null; return `<tr><td>${FMT_NAME[k]}</td><td>${s.n}</td><td><b>${s.caught} of ${s.n}</b></td><td>${avg == null ? '–' : fmt(avg) + ' s'}</td><td>${s.missed}</td><td>${s.fa}</td></tr>`; }).join('');
}
function integratorTick() {
  const now = Date.now();
  for (const [id, o] of Object.entries(inc)) {
    if (o.end != null && now - o.end > GRACE) { if (o.caught == null) { score[o.fmt].missed++; flash[id] = {kind:'missed', at:now}; lsSet('cx_score3', score); renderScore(); } delete inc[id]; }
    else if (now - o.t > 90000) delete inc[id];
  }
  DEVICES.forEach(d => { if (tileEl(d.id)) updateTile(d.id); });
}
function integratorView() {
  let h = `<div class="card"><div class="eyebrow">Plant view · team ${esc(me.team)}</div><h2>Spot the problem, raise the alarm</h2><div class="small muted">Suppliers cause problems on their devices. When you see one, press <b>Raise alarm</b> on that device within 10 seconds. Each box says when. The suppliers decide how they send their data, so some boxes are easy to read and some are not. Ask them for something better when you cannot read it.</div></div>`;
  h += `<div class="grid2"><div class="card"><div class="eyebrow">Devices</div><div class="tiles" id="tiles" style="margin-top:8px"><div class="muted" id="tilesWait">Waiting for suppliers to connect.</div></div></div>`;
  h += `<div><div class="card"><div class="eyebrow">Score by how the data came</div><table style="margin-top:6px" id="scoreTbl"></table><div class="small muted" style="margin-top:8px">Which way of sending made you fastest? Where did the false alarms come from?</div><div class="row" style="margin-top:8px"><button class="btn ghost" id="clrScore">Clear scores</button></div></div></div></div>`;
  $('#main').innerHTML = h;
  DEVICES.forEach(d => { if (latest[d.id] || hellos[d.id]) { ensureTile(d.id); updateTile(d.id); } });
  renderScore();
  $('#clrScore').onclick = () => { score = freshScore(); inc = {}; lsSet('cx_score3', score); renderScore(); };
}

/* ===== join ===== */
function joinView() {
  let role = me ? me.role : 'supplier', device = me ? me.device : 'freezer';
  $('#main').innerHTML = `<div class="card"><div class="eyebrow">Join your team</div><h2>One integrator, everyone else a supplier</h2>
    <div class="row"><div style="flex:1;min-width:140px"><label class="f">Team code</label><input type="text" id="jTeam" placeholder="for example c1" value="${esc(me ? me.team : params.get('team') || '')}"></div><div style="flex:1;min-width:140px"><label class="f">Your name</label><input type="text" id="jName" value="${esc(me ? me.name : '')}"></div></div>
    <label class="f">Your role</label><div class="pick" id="jRole"><button data-r="supplier"><b>Supplier</b><span>you own one device, decide how it sends its data, and cause problems</span></button><button data-r="integrator"><b>Integrator</b><span>you run the plant view, read the data and raise the alarm</span></button></div>
    <div id="jDevBox"><label class="f">Your device</label><div class="pick" id="jDev">${DEVICES.map(d => `<button data-d="${d.id}"><b>${esc(d.name)}</b><span>${esc(d.sup)}. ${esc(d.habit)}</span></button>`).join('')}</div></div>
    <label class="f">Server</label><select id="jBroker"><option value="emqx">Server A</option><option value="hivemq">Server B</option><option value="mosq">Server C</option><option value="shiftr">Server D, port 443</option><option value="custom">Own server URL</option></select><input type="text" id="jUrl" class="hide" placeholder="ws://192.168.1.10:9001" style="margin-top:6px">
    <div style="margin-top:14px"><button class="btn huge" id="jGo">Join</button></div><div class="small muted" style="margin-top:8px">Each device once per team. The integrator opens this page on a laptop or the projector.</div></div>`;
  const sync = () => { $$('#jRole button').forEach(b => b.classList.toggle('on', b.dataset.r === role)); $$('#jDev button').forEach(b => b.classList.toggle('on', b.dataset.d === device)); $('#jDevBox').classList.toggle('hide', role !== 'supplier'); };
  $$('#jRole button').forEach(b => b.onclick = () => { role = b.dataset.r; sync(); }); $$('#jDev button').forEach(b => b.onclick = () => { device = b.dataset.d; sync(); }); sync();
  $('#jBroker').value = (me && me.broker) || params.get('b') || 'emqx'; $('#jUrl').value = (me && me.url) || params.get('url') || '';
  $('#jBroker').onchange = () => $('#jUrl').classList.toggle('hide', $('#jBroker').value !== 'custom'); $('#jBroker').onchange();
  $('#jGo').onclick = () => { const team = $('#jTeam').value.trim().toLowerCase().replace(/[^\w-]/g, ''), name = $('#jName').value.trim(); if (!team || !name) return; me = {team, name, role, device, broker:$('#jBroker').value, url:$('#jUrl').value.trim()}; lsSet('cx_me', me); start(); };
}
function render() {
  if (!me) { joinView(); return; }
  $('#whoText').innerHTML = `${esc(me.name)} · ${esc(me.team)} · <a href="#" id="chg" style="color:#c9d7ea">change</a>`; $('#chg').onclick = e => { e.preventDefault(); clearInterval(sendTimer); clearInterval(tickTimer); if (client) client.close(); client = null; joinView(); };
  if (me.role === 'integrator') integratorView(); else supplierView();
}
let tickTimer = 0;
function start() { render(); connect(); clearInterval(tickTimer); if (me.role !== 'integrator') supplierLoop(); else tickTimer = setInterval(integratorTick, 1000); }
if (me) start(); else joinView();
</script>
</body>
</html>
