<script>
/* ===== minimal MQTT 3.1.1 over WebSocket ===== */
class MiniMQTT {
  constructor(url, o = {}) { this.url = url; this.o = o; this.buf = new Uint8Array(0); this.subs = []; this.pid = 1; this.enc = new TextEncoder(); this.dec = new TextDecoder(); }

    try { this.ws = new WebSocket(this.url, ['mqtt']); } catch (e) { return fail(e); }
    this.ws.binaryType = 'arraybuffer'; const to = setTimeout(() => { fail(new Error('timeout')); try { this.ws.close(); } catch (e) {} }, 8000);
    this.ws.onopen = () => { let f = 0x02; const pl = this._s('ml2305-' + Math.random().toString(36).slice(2, 10)); if (this.o.username) { f |= 0x80; pl.push(...this._s(this.o.username)); } if (this.o.password) { f |= 0x40; pl.push(...this._s(this.o.password)); } this._send(0x10, [...this._s('MQTT'), 4, f, 0, 30, ...pl]); this._ping = setInterval(() => this._send(0xC0, []), 20000); };

      for (;;) { if (this.buf.length < 2) break; let m = 1, len = 0, i = 1, b; do { if (i >= this.buf.length) return; b = this.buf[i++]; len += (b & 127) * m; m *= 128; } while (b & 128); if (this.buf.length < i + len) break;
        const h = this.buf[0], body = this.buf.slice(i, i + len); this.buf = this.buf.slice(i + len); const t = h >> 4;
        if (t === 2) { clearTimeout(to); if (body[1] === 0) { done = true; this.subs.forEach(s => this._sub(s)); res(); this.onstatus && this.onstatus('on'); } else fail(new Error('refused')); }
        else if (t === 3) { const q = (h >> 1) & 3, tl = (body[0] << 8) | body[1], topic = this.dec.decode(body.slice(2, 2 + tl)); let p = 2 + tl; if (q > 0) { const id = [body[p], body[p + 1]]; p += 2; if (q === 1) this._send(0x40, id); } this.onmessage && this.onmessage(topic, this.dec.decode(body.slice(p))); } } };
    this.ws.onerror = () => { fail(new Error('error')); this.onstatus && this.onstatus('err'); };
    this.ws.onclose = () => { clearInterval(this._ping); this.onstatus && this.onstatus(done ? 'closed' : 'err'); fail(new Error('closed')); }; }); }
  _sub(f) { const id = this.pid++ & 0xffff; this._send(0x82, [id >> 8, id & 255, ...this._s(f), 0]); }
  subscribe(f) { if (!this.subs.includes(f)) this.subs.push(f); this._sub(f); }
  publish(t, p, retain) { return this._send(retain ? 0x31 : 0x30, [...this._s(t), ...this.enc.encode(p)]); }

const $ = s => document.querySelector(s), $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search), BOARD = !!params.get('board');
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const fmt = (v, d = 1) => (v == null || isNaN(v)) ? '–' : (+v).toFixed(d);
const dev = lsGet('mk5_dev', null) || (() => { const s = Math.random().toString(36).slice(2, 9); lsSet('mk5_dev', s); return s; })();

/* ===== layout of the lab supermarket. Every position has the name and the label printed on the rack.
   In each level the positions are listed from the start of the aisle outwards ===== */
const P = (c, n) => ({c, n});
const DEF_LAYOUT = {start:0.9, bayW:1.2, gap:0.1, cross:0.8, flip:false, swap:false, lines:6, rounds:4, racks:[
  {id:'01', side:-1, bay:0, levels:[[P('01-01-A', 'DOG'), P('01-01-B', 'CHAIR')], [P('01-02-A', 'AIR'), P('01-02-B', 'CAR'), P('01-02-C', 'CHOCOLATE')]]},
  {id:'03', side:-1, bay:1, levels:[[P('03-01-A', 'SHOE'), P('03-01-B', 'GLASS')], [P('03-02-A', 'STAR'), P('03-02-B', 'PEN'), P('03-02-C', 'SKY')]]},
  {id:'02', side:1, bay:0, levels:[[P('02-01-A', 'KEY'), P('02-01-B', 'CAT')], [P('02-02-A', 'LIGHT'), P('00-01', 'ICE CREAM'), P('02-02-B', 'BALL')]]},
  {id:'04', side:1, bay:1, levels:[[P('04-01-A', 'SALT'), P('04-01-B', 'SUN')], [P('04-02-A', 'FLOWER'), P('04-02-B', 'WINDOW')]]}]};
const LETTERS = 'ABCDEFGHIJ';
let layout = JSON.parse(JSON.stringify(DEF_LAYOUT)), IDX = {};
function reindex() { IDX = {}; layout.racks.forEach((r, ri) => r.levels.forEach((lv, li) => lv.forEach((p, k) => { IDX[p.c] = {ri, rack:r, lv:li + 1, k, n:lv.length, name:p.n}; }))); }
reindex();
const lv2 = l => String(l).padStart(2, '0');
function allCodes() { const out = []; layout.racks.forEach(r => r.levels.forEach(lv => lv.forEach(p => out.push(p.c)))); return out; }
const sig = () => JSON.stringify([allCodes(), layout.lines]);
function parse(c) { return IDX[c] || null; }
const nBays = () => Math.max(...layout.racks.map(r => r.bay)) + 1;
const aisleEnd = () => layout.start + nBays() * layout.bayW + (nBays() - 1) * layout.gap;
const effSide = r => r.side * (layout.flip ? -1 : 1) * (layout.swap ? -1 : 1);   // walking in from the other end swaps left and right
const bayX0 = r => { const x0 = layout.start + r.bay * (layout.bayW + layout.gap); return layout.flip ? layout.start + aisleEnd() - x0 - layout.bayW : x0; };
function pos(c) {
  if (c === 'START') return {x:0, side:0};
  const p = IDX[c]; if (!p) return {x:0, side:0};
  const f = (p.k + .5) / p.n;
  return {x:bayX0(p.rack) + (layout.flip ? 1 - f : f) * layout.bayW, side:effSide(p.rack)};
}
function dist(a, b) { const A = pos(a), B = pos(b); return Math.abs(A.x - B.x) + (A.side && B.side && A.side !== B.side ? layout.cross : 0); }
function itemName(c) { return IDX[c] ? IDX[c].name : c; }
const nLv = () => Math.max(...layout.racks.map(r => r.levels.length));
const lvName = l => l === 1 ? 'level 1, bottom' : l === nLv() ? `level ${l}, top` : `level ${l}`;
function orderFor(round) {
  const pool = allCodes(), r = mulberry(hashStr(sig()) + round * 7919), out = [];
  while (out.length < Math.min(layout.lines, pool.length)) out.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
  return out;
}
const STRATS = [['listed', 'As listed', 'Pick the lines in the order they arrived.'], ['nearest', 'Nearest next', 'Always walk to the closest item that is left.'], ['onepass', 'One pass', 'Walk once to the far end in order, then back.'], ['loop', 'Out left, back right', 'Left side on the way out, right side on the way back.']];
function seqFor(k, order) {
  if (k === 'nearest') { const rest = order.slice(), out = []; let p = 'START'; while (rest.length) { let bi = 0, bd = Infinity; rest.forEach((c, i) => { const d = dist(p, c); if (d < bd - 1e-9) { bd = d; bi = i; } }); p = rest.splice(bi, 1)[0]; out.push(p); } return out; }

  if (k === 'loop') { const L = order.filter(c => pos(c).side < 0).sort((a, b) => pos(a).x - pos(b).x), R = order.filter(c => pos(c).side > 0).sort((a, b) => pos(b).x - pos(a).x); return L.concat(R); }

}
function segments(seq) { const out = []; let p = 'START'; for (const c of seq) { out.push({d:dist(p, c), lv:parse(c).lv}); p = c; } out.push({d:dist(p, 'START'), lv:0}); return out; }

/* ===== the model. Every segment is walk time plus pick time at its level, learned from the taps ===== */
const PRIOR_A = 1.1, PRIOR_B = 4, TAU_A = .5, TAU_B = 2.5, SIG0 = 2;
function feat(s) { const f = [s.d]; for (let l = 1; l <= nLv(); l++) f.push(s.lv === l ? 1 : 0); return f; }
function inv(A) { const n = A.length, M = A.map((r, i) => r.concat(A.map((_, j) => i === j ? 1 : 0))); for (let c = 0; c < n; c++) { let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r; [M[c], M[p]] = [M[p], M[c]]; const d = M[c][c] || 1e-12; for (let k = 0; k < 2 * n; k++) M[c][k] /= d; for (let r = 0; r < n; r++) if (r !== c) { const f = M[r][c]; for (let k = 0; k < 2 * n; k++) M[r][k] -= f * M[c][k]; } } return M.map(r => r.slice(n)); }
function fit(hist, upto) {

  const th0 = [PRIOR_A].concat(Array(nLv()).fill(PRIOR_B)), tau = [TAU_A].concat(Array(nLv()).fill(TAU_B));

  for (let it = 0; it < 3; it++) {
    const A = Array.from({length:P}, () => Array(P).fill(0)), b = Array(P).fill(0);
    for (let j = 0; j < P; j++) { A[j][j] += 1 / (tau[j] * tau[j]); b[j] += th0[j] / (tau[j] * tau[j]); }

const points = (actual, promise) => actual <= promise ? Math.round(100 * actual / promise) : 0;

/* ===== connection ===== */
const BROKERS = {emqx:{url:'wss://broker.emqx.io:8084/mqtt'}, hivemq:{url:'wss://broker.hivemq.com:8884/mqtt'}, mosq:{url:'wss://test.mosquitto.org:8081/'}, shiftr:{url:'wss://public.cloud.shiftr.io', username:'public', password:'public'}};
let me = lsGet('mk5_me', null);   // {cls, team, name, role, broker, url}
let client = null, st = null, teams = {}, layoutSeen = false;
const CLS = () => ((me && me.cls) || params.get('class') || lsGet('mk5_cls', 'lab3')).toLowerCase().replace(/[^\w-]/g, '') || 'lab3';
const T = s => `ml2305/mkt-${CLS()}/${s}`;
function pub(s, o, retain) { if (client) client.publish(T(s), o == null ? '' : JSON.stringify(o), !!retain); }
async function connect(brokerKey, url) {

  const p = brokerKey === 'custom' ? {url} : BROKERS[brokerKey || 'emqx'];
  const c = new MiniMQTT(p.url, {username:p.username, password:p.password});
  c.onmessage = onMsg; c.onstatus = s => { if (client === c && s !== 'on') { $('#dot').className = 'dot err'; setTimeout(() => { if (client === c) connect(brokerKey, url); }, 3000); } };
  try { await c.connect(); client = c; $('#dot').className = 'dot on'; c.subscribe(T('layout')); if (BOARD) c.subscribe(T('team/+')); else c.subscribe(T('team/' + me.team)); }
  catch (e) { $('#dot').className = 'dot err'; setTimeout(() => connect(brokerKey, url), 3000); return; }
  setTimeout(() => {
    if (BOARD && !layoutSeen) pub('layout', layout, true);
    if (!BOARD) { if (!st) { st = newTeam(); } register(); }
  }, 1500);
}
function onMsg(topic, payload) {
  let m = null; if (payload) { try { m = JSON.parse(payload); } catch (e) { return; } }
  const parts = topic.split('/');
  if (parts[2] === 'layout') { if (m && m.racks && m.racks[0] && Array.isArray(m.racks[0].levels) && Array.isArray(m.racks[0].levels[0])) { layout = m; layoutSeen = true; reindex(); if (BOARD) { boardSetup = false; } render(); } return; }
  if (parts[2] === 'team') {
    const id = parts[3];
    if (BOARD) { if (m) teams[id] = m; else delete teams[id]; render(); return; }
    if (!m) { st = newTeam(); render(); return; }
    if (!st || m.rev > st.rev || (m.rev === st.rev && (m.by || '') > (st.by || ''))) { st = m; render(); }

  let h = `<div class="card"><div class="eyebrow">The rack</div><div class="queue" style="margin-top:8px">${atRack.map(i => `<div class="now">At the rack ${esc(i)} · ${fmt((now - teams[i].run.t0) / 1000, 0)} s</div>`).join('')}${queue.map((i, k) => `<div>${k === 0 && !atRack.length ? 'Next ' : ''}${esc(i)}</div>`).join('') || (atRack.length ? '' : '<span class="muted">Nobody is waiting for the rack.</span>')}</div></div>`;
  h += `<div class="grid2"><div class="card"><div class="eyebrow">More data, better predictions</div>${errChart(ids)}<div class="small muted">Model error of every team, round by round. Zero is a perfect prediction.</div></div>`;
  h += `<div class="card"><div class="eyebrow">Leaderboard</div><table><tr><th>Team</th><th>Round</th><th>Last error</th><th>Points</th></tr>${ids.map(i => { const t = teams[i], l = t.hist[t.hist.length - 1]; return {i, t, l, p:t.hist.reduce((a, x) => a + x.points, 0)}; }).sort((a, b) => b.p - a.p).map(({i, t, l, p}) => `<tr><td><b>${esc(i)}</b><div class="small muted">${Object.values(t.members || {}).map(m => esc(m.name)).join(', ')}</div></td><td>${t.round}${t.phase === 'done' ? ' done' : ''}</td><td>${l ? (l.err > 0 ? '+' : '') + Math.round(l.err * 100) + '%' : '–'}</td><td><b>${p}</b></td></tr>`).join('')}</table></div></div>`;
  $('#boardLive').innerHTML = h;
}
function uniqueCode(base) { let c = base, i = 2; while (IDX[c]) c = base + '-' + i++; return c; }
function renderSetup() {
  const el = $('#boardSetup'); if (!el) return;
  const rk = (r, ri) => `<div class="rk"><div class="row"><b>Rack ${+r.id || esc(r.id)}</b><span class="small muted">${effSide(r) < 0 ? 'left' : 'right'} side, bay ${r.bay + 1} from the start</span><button class="btn ghost sm" data-e="side" data-r="${ri}">Other side</button><button class="btn ghost sm" data-e="bay" data-r="${ri}" data-d="-1">Bay −</button><button class="btn ghost sm" data-e="bay" data-r="${ri}" data-d="1">Bay +</button></div>
    ${r.levels.map((lv, li) => ({lv, li})).reverse().map(({lv, li}) => `<div class="lvl"><span class="small muted">level ${li + 1}${li === 0 ? ', floor' : ''}</span>${lv.map((p, k) => `<span class="pos"><input class="pn" value="${esc(p.n)}" data-r="${ri}" data-l="${li}" data-k="${k}" aria-label="name"><input class="pc" value="${esc(p.c)}" data-r="${ri}" data-l="${li}" data-k="${k}" aria-label="label"><button data-e="del" data-r="${ri}" data-l="${li}" data-k="${k}" title="remove">✕</button></span>`).join('')}<button class="btn ghost sm" data-e="add" data-r="${ri}" data-l="${li}">+ position</button></div>`).join('')}
    <div class="row" style="margin-top:6px"><button class="btn ghost sm" data-e="addlv" data-r="${ri}">+ level on top</button>${r.levels.length > 1 ? `<button class="btn ghost sm" data-e="dellv" data-r="${ri}">− top level</button>` : ''}</div></div>`;
  el.innerHTML = `<div class="eyebrow">Supermarket layout</div><p class="small muted">It starts as our lab supermarket. Edit names, labels and positions if the racks change, then send it to every phone. In every level the positions run from the start of the aisle outwards. Changing the layout during class changes the orders.</p>
    <div class="row"><button class="btn ghost" data-e="flip">${layout.flip ? 'Start at the first end again' : 'Start at the other end'}</button><button class="btn ghost" data-e="swap">Swap left and right</button><button class="btn ghost" data-e="reset">Back to the lab layout</button></div>
    <div class="row" style="margin-top:8px"><span class="small">start to first rack</span><span class="stepper"><button data-e="off" data-d="-0.1">−</button><b>${fmt(layout.start)} m</b><button data-e="off" data-d="0.1">+</button></span><span class="small">bay width</span><span class="stepper"><button data-e="len" data-d="-0.1">−</button><b>${fmt(layout.bayW)} m</b><button data-e="len" data-d="0.1">+</button></span><span class="small">cross the aisle</span><span class="stepper"><button data-e="cross" data-d="-0.1">−</button><b>${fmt(layout.cross)} m</b><button data-e="cross" data-d="0.1">+</button></span></div>
    <div class="row" style="margin-top:8px"><span class="stepper"><button data-e="lines" data-d="-1">−</button><b>${layout.lines} lines</b><button data-e="lines" data-d="1">+</button></span><span class="stepper"><button data-e="rounds" data-d="-1">−</button><b>${layout.rounds} rounds</b><button data-e="rounds" data-d="1">+</button></span></div>
    <div id="layMap" style="margin-top:10px">${mapSVG(orderFor(1))}</div><div class="small muted">Shown with the order of round 1.</div>
    <div class="racks-ed">${layout.racks.map(rk).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="pubLay">Send layout to every phone</button><button class="btn ghost" id="clr">Clear all teams</button><span class="small muted">Students open ${esc(location.host + location.pathname)}?class=${esc(CLS())}</span></div>`;
  const redo = () => { reindex(); renderSetup(); };
  $$('#boardSetup [data-e]').forEach(b => b.onclick = () => {
    const e = b.dataset.e, d = +b.dataset.d, r = layout.racks[+b.dataset.r], l = +b.dataset.l, k = +b.dataset.k;
    if (e === 'side') r.side = -r.side;
    if (e === 'bay') r.bay = Math.max(0, Math.min(5, r.bay + d));
    if (e === 'del') { if (r.levels[l].length > 1) r.levels[l].splice(k, 1); else alertMsg('A level needs at least one position.'); }
    if (e === 'add') { const n = r.levels[l].length; r.levels[l].push(P(uniqueCode(`${r.id}-${lv2(l + 1)}-${LETTERS[n] || n + 1}`), 'NEW ITEM')); }
    if (e === 'addlv') { const li = r.levels.length; r.levels.push(r.levels[li - 1].map((_, j) => P(uniqueCode(`${r.id}-${lv2(li + 1)}-${LETTERS[j] || j + 1}`), 'NEW ITEM'))); }
    if (e === 'dellv' && r.levels.length > 1) r.levels.pop();
    if (e === 'flip') layout.flip = !layout.flip; if (e === 'swap') layout.swap = !layout.swap;
    if (e === 'reset') { if (!confirmTwice('reset')) return; layout = JSON.parse(JSON.stringify(DEF_LAYOUT)); }
    if (e === 'off') layout.start = Math.max(0, +(layout.start + d).toFixed(2)); if (e === 'len') layout.bayW = Math.max(.4, +(layout.bayW + d).toFixed(2)); if (e === 'cross') layout.cross = Math.max(0, +(layout.cross + d).toFixed(2));
    if (e === 'lines') layout.lines = Math.max(3, Math.min(12, layout.lines + d)); if (e === 'rounds') layout.rounds = Math.max(2, Math.min(8, layout.rounds + d));
    redo();
  });
  $$('#boardSetup input.pn').forEach(i => i.onchange = () => { const v = i.value.trim().toUpperCase() || 'ITEM'; layout.racks[+i.dataset.r].levels[+i.dataset.l][+i.dataset.k].n = v; reindex(); $('#layMap').innerHTML = mapSVG(orderFor(1)); });
  $$('#boardSetup input.pc').forEach(i => i.onchange = () => { const p = layout.racks[+i.dataset.r].levels[+i.dataset.l][+i.dataset.k], v = i.value.trim(); if (!v || (v !== p.c && IDX[v])) { alertMsg('Every position needs its own label.'); i.value = p.c; return; } p.c = v; reindex(); $('#layMap').innerHTML = mapSVG(orderFor(1)); });
  $('#pubLay').onclick = () => { pub('layout', layout, true); alertMsg('Layout sent to every phone.'); };
  $('#clr').onclick = () => { if (confirmTwice('clr')) { Object.keys(teams).forEach(i => pub('team/' + i, null, true)); teams = {}; render(); } else alertMsg('Tap again to clear every team.'); };
}
function errChart(ids) {
  const W = 560, H = 240, L = 44, R = 12, Tp = 14, B = 30, n = Math.max(layout.rounds, ...ids.map(i => teams[i].hist.length), 1);
  const all = ids.flatMap(i => teams[i].hist.map(h => Math.abs(h.err) * 100)), ymax = Math.max(40, ...all) * 1.1;
  const sx = r => L + (r + .5) * (W - L - R) / n, sy = v => H - B - v / ymax * (H - B - Tp), cols = ['#004791', '#b04512', '#0b7464', '#6b3fa8', '#c4422b', '#2f8fd8', '#8a5a00', '#14633a'];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  const stp = ymax > 150 ? 50 : ymax > 80 ? 20 : 10; for (let v = 0; v <= ymax; v += stp) s += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="#eef0f3"/><text x="${L - 6}" y="${sy(v) + 4}" font-size="11" text-anchor="end" fill="#6b7785">${v}%</text>`;
  for (let r = 0; r < n; r++) s += `<text x="${sx(r)}" y="${H - 10}" font-size="12" text-anchor="middle" font-weight="700" fill="#4a5563">Round ${r + 1}</text>`;
  ids.forEach((i, k) => { const pts = teams[i].hist.map((h, r) => [sx(r), sy(Math.abs(h.err) * 100)]); if (!pts.length) return; const c = cols[k % cols.length]; s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="3"/>` + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${c}"/>`).join('') + `<text x="${pts[pts.length - 1][0] + 8}" y="${pts[pts.length - 1][1] + 4}" font-size="12" font-weight="800" fill="${c}">${esc(i)}</text>`; });
  const avg = []; for (let r = 0; r < n; r++) { const v = ids.map(i => teams[i].hist[r]).filter(Boolean).map(h => Math.abs(h.err) * 100); if (v.length) avg.push([sx(r), sy(v.reduce((a, b) => a + b, 0) / v.length)]); }
  if (avg.length > 1) s += `<polyline points="${avg.map(p => p.join(',')).join(' ')}" fill="none" stroke="#16212e" stroke-width="5" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  return s + '</svg>';
}

/* ===== render ===== */
let lastRender = 0;
function render(tick) {
  if (tick) { $$('.timer').forEach(t => t.textContent = fmt(elapsed()) + ' s'); return; }   // only the clock moves, buttons stay put
  lastRender = Date.now();
  if (BOARD) { $('#ttl').textContent = 'Supermarket class board'; $('#sub').textContent = 'ML2305 Lab 3 · class ' + CLS(); $('#whoText').textContent = Object.keys(teams).length + ' teams'; boardView(); return; }
  if (!me || !client && !st) { if (!me) { joinView(); return; } }
  $('#whoText').innerHTML = `${esc(me.name)} · ${esc(me.team)} · <a href="#" id="chg" style="color:#c9d7ea">change</a>`; const chg = $('#chg'); if (chg) chg.onclick = e => { e.preventDefault(); if (client) client.close(); client = null; st = null; joinView(); };
  if (!st) { $('#main').innerHTML = '<div class="card">Connecting to your team…</div>'; return; }
  if (me.role === 'planner') plannerView(false); else if (me.role === 'viewer') plannerView(true); else if (me.role === 'picker') pickerView(); else recorderView();
}
if (BOARD) { connect(params.get('b') || 'emqx', params.get('url') || ''); render(); }
else if (me) { render(); connect(me.broker, me.url); } else joinView();
</script>
