<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Duck Family Logistics Graph</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    #network {
      width: 100%;
      height: 800px;
      border: 1px solid lightgray;
    }
  </style>
</head>
<body>
  <h2>Duck Family Logistics Model - Graph Visualization</h2>
  <div id="network"></div>

  <script>
    const nodes = new vis.DataSet([
      // Mother Ducks (Main AMRs)
      { id: 1, label: "Mother Duck A", color: '#f39c12', shape: 'ellipse' },
      { id: 2, label: "Mother Duck B", color: '#f1c40f', shape: 'ellipse' },
      { id: 3, label: "Mother Duck C", color: '#e67e22', shape: 'ellipse' },
      { id: 4, label: "Mother Duck D", color: '#d35400', shape: 'ellipse' },

      // Ducklings (Auxiliary AMRs)
      { id: 5, label: "KitBot A", color: '#3498db' },
      { id: 6, label: "ToolBot A", color: '#2ecc71' },
      { id: 7, label: "WasteBot A", color: '#9b59b6' },
      { id: 8, label: "KitBot B", color: '#2980b9' },
      { id: 9, label: "ToolBot B", color: '#27ae60' },
      { id: 10, label: "WasteBot B", color: '#8e44ad' },
      { id: 11, label: "KitBot C", color: '#5dade2' },
      { id: 12, label: "ToolBot C", color: '#58d68d' },
      { id: 13, label: "WasteBot C", color: '#af7ac5' },
      { id: 14, label: "KitBot D", color: '#1f618d' },
      { id: 15, label: "ToolBot D", color: '#239b56' },
      { id: 16, label: "WasteBot D", color: '#884ea0' },

      // Stations
      { id: 17, label: "Station 1", color: '#95a5a6', shape: 'box' },
      { id: 18, label: "Station 2", color: '#95a5a6', shape: 'box' },
      { id: 19, label: "Station 3", color: '#95a5a6', shape: 'box' },
      { id: 20, label: "Station 4", color: '#95a5a6', shape: 'box' },
      { id: 21, label: "Station 5", color: '#95a5a6', shape: 'box' },
      
      // Charging Stations
      { id: 22, label: "Small Charging Station", color: '#e74c3c', shape: 'diamond' },
      { id: 23, label: "Large Charging Station", color: '#c0392b', shape: 'star' }
    ]);

    const edges = new vis.DataSet([
      // Mother A + Ducklings
      { from: 1, to: 5, label: "follows", arrows: 'to', dashes: true },
      { from: 1, to: 6, label: "follows", arrows: 'to', dashes: true },
      { from: 1, to: 7, label: "follows", arrows: 'to', dashes: true },
      { from: 1, to: 17, label: "to station", arrows: 'to' },
      { from: 1, to: 18, label: "to station", arrows: 'to' },

      // Mother B + Ducklings
      { from: 2, to: 8, label: "follows", arrows: 'to', dashes: true },
      { from: 2, to: 9, label: "follows", arrows: 'to', dashes: true },
      { from: 2, to: 10, label: "follows", arrows: 'to', dashes: true },
      { from: 2, to: 18, label: "to station", arrows: 'to' },
      { from: 2, to: 19, label: "to station", arrows: 'to' },

      // Mother C + Ducklings
      { from: 3, to: 11, label: "follows", arrows: 'to', dashes: true },
      { from: 3, to: 12, label: "follows", arrows: 'to', dashes: true },
      { from: 3, to: 13, label: "follows", arrows: 'to', dashes: true },
      { from: 3, to: 19, label: "to station", arrows: 'to' },
      { from: 3, to: 20, label: "to station", arrows: 'to' },

      // Mother D + Ducklings
      { from: 4, to: 14, label: "follows", arrows: 'to', dashes: true },
      { from: 4, to: 15, label: "follows", arrows: 'to', dashes: true },
      { from: 4, to: 16, label: "follows", arrows: 'to', dashes: true },
      { from: 4, to: 20, label: "to station", arrows: 'to' },
      { from: 4, to: 21, label: "to station", arrows: 'to' },

      // Ducklings to station
      { from: 5, to: 17, label: "deliver kit", arrows: 'to' },
      { from: 6, to: 17, label: "deliver tools", arrows: 'to' },
      { from: 7, to: 18, label: "collect waste", arrows: 'to' },

      { from: 8, to: 18, label: "deliver kit", arrows: 'to' },
      { from: 9, to: 19, label: "deliver tools", arrows: 'to' },
      { from: 10, to: 19, label: "collect waste", arrows: 'to' },

      { from: 11, to: 19, label: "deliver kit", arrows: 'to' },
      { from: 12, to: 20, label: "deliver tools", arrows: 'to' },
      { from: 13, to: 20, label: "collect waste", arrows: 'to' },

      { from: 14, to: 20, label: "deliver kit", arrows: 'to' },
      { from: 15, to: 21, label: "deliver tools", arrows: 'to' },
      { from: 16, to: 21, label: "collect waste", arrows: 'to' },

      // Charging Stations
      { from: 1, to: 23, label: "charge", arrows: 'to' },
      { from: 2, to: 23, label: "charge", arrows: 'to' },
      { from: 3, to: 23, label: "charge", arrows: 'to' },
      { from: 4, to: 23, label: "charge", arrows: 'to' },

      { from: 5, to: 22, label: "charge", arrows: 'to' },
      { from: 6, to: 22, label: "charge", arrows: 'to' },
      { from: 7, to: 22, label: "charge", arrows: 'to' },
      { from: 8, to: 22, label: "charge", arrows: 'to' },
      { from: 9, to: 22, label: "charge", arrows: 'to' },
      { from: 10, to: 22, label: "charge", arrows: 'to' },
      { from: 11, to: 22, label: "charge", arrows: 'to' },
      { from: 12, to: 22, label: "charge", arrows: 'to' },
      { from: 13, to: 22, label: "charge", arrows: 'to' },
      { from: 14, to: 22, label: "charge", arrows: 'to' },
      { from: 15, to: 22, label: "charge", arrows: 'to' },
      { from: 16, to: 22, label: "charge", arrows: 'to' }
    ]);

    const container = document.getElementById('network');
    const data = { nodes, edges };
    const options = {
      layout: {
        hierarchical: false
      },
      interaction: {
        hover: true
      },
      physics: {
        stabilization: true
      }
    };

    new vis.Network(container, data, options);
  </script>
</body>
</html>
